site_name: Falcon Player (FPP) User Manual
site_description: FPP version 10 User Manual — web edition
site_author: The FPP Community
# Served from GitHub Pages for this repo. Update if you attach a custom domain.
site_url: https://falconchristmas.github.io/fpp-manual-generator/
repo_url: https://github.com/FalconChristmas/fpp-manual-generator
repo_name: fpp-manual-generator
docs_dir: web/docs
site_dir: web/site
# Use directory URLs (…/status-page/) but keep everything relative so the built
# site works when opened from a subfolder or a plain file:// path too.
use_directory_urls: true

theme:
  name: material
  # Adds the persistent "Download PDF / Word" announcement bar (web/overrides/
  # main.html) to the top of every page. Path is relative to this config file.
  custom_dir: web/overrides
  features:
    - navigation.top        # back-to-top button
    - navigation.tracking   # update URL with the active anchor
    - navigation.footer     # prev/next chapter links
    - navigation.expand     # start nav groups (Status/Control, etc.) expanded so the
                             # indented child pages are visible without clicking
    - toc.follow
    - search.suggest        # autocomplete search terms
    - search.highlight      # highlight matches on the page
    - content.code.copy     # copy button on code blocks
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

# Explicit nav (mirrors the four v10 web UI menus: Status/Control, Content Setup,
# Input/Output Setup, Help — see chapters/008-overview-navigation.md). Chapters
# that belong to one of those menus are nested under it so the sidebar shows them
# indented as children, matching where they live in the FPP UI; front-matter and
# appendix chapters stay top-level. New chapters must be added here explicitly —
# unlike the old filename-order auto-nav, they will NOT appear on their own.
#
# Numbering: filenames use a zero-padded 3-digit prefix. Main-content chapters
# (000-058) are numbered close together since they're actively being split into
# smaller chapters; back matter starts at 100 and increments by 2, leaving a
# free slot between each for future additions without a wholesale renumber.
nav:
  - About This Manual: index.md
  - Introduction: 002-introduction.md
  - Hardware Needed: 004-hardware.md
  - FPP Quick Start Guide: 006-quickstart.md
  - General Overview and Navigation: 008-overview-navigation.md
  - Status/Control:
    - Overview: 010-status-overview.md
    - Status Page: 012-status.md
    - Port Status: 014-port-status.md
    - Network: 016-network.md
    - MultiSync: 018-multisync.md
    - FPP Settings: 020-fpp-settings.md
    - Backup and Restore: 022-backup-restore.md
    - Proxy Settings: 024-proxy.md
    - Command Presets: 026-command-presets.md
    - Effects: 028-effects.md
    - Display Testing: 030-testing.md
  - Content Setup:
    - Overview: 032-content-overview.md
    - File Manager: 034-file-manager.md
    - Playlists: 036-playlists.md
    - Scheduler: 038-scheduler.md
    - Scripts: 040-scripts.md
    - Plugins: 042-plugins.md
    - Packages: 044-packages.md
    - Variables: 046-variables.md
    - Recurring Tasks: 048-recurring.md
  - Input/Output Setup:
    - Overview: 050-inputs-outputs-overview.md
    - Channel Inputs: 052-channel-inputs.md
    - Channel Outputs: 054-channel-outputs.md
    - Output Processors: 056-output-processors.md
    - Pixel Overlay Models: 058-pixel-overlay-models.md
    - GPIO Inputs: 060-gpio-inputs.md
  - Help:
    - Help and Troubleshooting: 064-help-troubleshooting.md
    - "Appendix B: Protocols, Ports and the API": 066-appendix-protocols.md
  - Glossary: 100-glossary.md
  - Pixel Port Licensing: 102-pixel-port-licensing.md
  - Advanced Options: 104-advanced-options.md
  - Virtual Display: 106-virtual-display-3d.md
  - Networking:
    - Overview: 108-networking-overview.md
    - Standalone: 110-standalone.md
    - Home Network: 112-home-network.md
    - Separate Network: 114-separate-network.md
  - Pipewire: 116-pipewire-pipeline.md
  - Resources:
    - Overview: 120-resources.md
    - Help: 122-help.md
    - Configuring a Static Route: 124-static-route.md
    - Creating a Proxy Host: 126-proxy-host.md
    - FPP Connect: 128-fpp-connect.md
    - GPIO Button Input: 130-gpio-button.md
    - Networking Explained: 132-networking-explained.md
    - Troubleshooting: 134-troubleshooting.md

# Material's default sidebar tree doesn't indent nested chapters under a group
# heading (Status/Control, etc.) on its own — see web/css/nav-indent.css, staged
# into docs_dir by build-web.sh.
extra_css:
  - css/nav-indent.css

markdown_extensions:
  - tables
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
      toc_depth: 4

plugins:
  - search
